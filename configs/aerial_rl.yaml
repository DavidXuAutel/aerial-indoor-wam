# Aerial WAM v2 — model-based RL skeleton config (Plan A).
# Standalone (not composed via defaults); consumed by
# experiments/aerial/rl/train_rl.py. Override on the CLI, e.g.
#   python -m experiments.aerial.rl.train_rl env.backend=airsim corrector.smoke=true

env:
  backend: mock            # mock | airsim
  host: 10.229.20.125      # 4090 renderer (see config.env); airsim backend only
  port: 41451
  camera: front_custom
  vehicle: drone_1
  width: 224               # working resolution — Fork A confirmed here
  height: 224
  # Plan-A serial real-env rate. CAPTURE-ONLY L2f is ~20 fps; CLOSED loop is slower.
  # 4090 loopback (2026-08-04, after depth-aware observe_budget):
  #   RGB-only ceiling ~14 Hz; grab_depth=true ceiling ~6.2 Hz (observe~120 ms).
  #   Commanded 5.0 + depth rate-locks (achieved 4.99); commanded 6.0 is near the
  #   ceiling (5.6–6.0). Cross-net H100→4090 depth was ~0.7 Hz — do NOT collect depth
  #   off-box. Legacy dataset_v0 labeled 12 Hz / achieved ~7.9 is dt-desynced smoke.
  step_hz: 5.0
  grab_depth: false        # depth is supervision-only (spec §1.2); enable via
                           # collect_dataset --grab-depth on 4090 loopback at step_hz≤5.
  health_check: true       # sanity-gate IMU + depth on reset (airsim backend)
  seed: 0

buffer:
  capacity_episodes: 1000
  seed: 0

reward:
  w_progress: 1.0
  w_collision: 10.0
  w_maneuver: 0.01         # maneuver-penalty curriculum START weight
  success_bonus: 10.0
  # Online arrival/termination radius (m). Deliberately TIGHTER than the eval
  # success metric (metrics.OPENFLY_SUCCESS_DIST_M = 20 m): the eval radius is a
  # loose "did it get to the region" score, not a per-step termination gate.
  success_dist_m: 3.0
  # Maneuver-penalty curriculum (design doc §2.4): keep the aggressive-maneuver
  # penalty low early, ramp it up as competence (mean episode return) rises. The
  # corrector rewrites the live w_maneuver each iter, ramping from the START
  # weight above toward w_maneuver_final over [threshold, threshold+ramp].
  # Defaults below make it a NO-OP (final == start). The threshold is a project
  # placeholder for OUR SEARCH regime — NOT DreamerV3's reward-50.0 (§1.5).
  w_maneuver_final: 0.01
  maneuver_curriculum_threshold: 0.0
  maneuver_curriculum_ramp: 1.0

dynamics:
  kind: torch              # V1a PASS 2026-08-15 (_wm_train_validate r60 + corrector smoke)
  latent_dim: 8
  collide_radius_m: 2.0

# DreamerV3-aligned latent world model (design doc §2.1/§2.2). Consumed by
# dynamics.kind=torch (Phase 2b, dynamics_torch.py) — the recipe transfers, the
# tuning does not (§1.5). Inert unless kind=torch is selected.
world_model:
  recurrent_dim: 512       # RSSM deterministic h (GRU)
  stoch_dim: 32            # discrete latent groups
  stoch_classes: 32        # classes per group (32x32 categorical z, DreamerV3)
  pred_transform: symlog   # reward/progress head regresses symlog(target)
  reward_head: two_hot
  num_bins: 255            # two-hot grid over symlog space
  bin_lo: -20.0
  bin_hi: 20.0
  free_bits: 1.0           # per-term KL floor (nats)
  loss_scales:             # §1.5 governing boundary
    pred: 1.0
    dyn: 1.0
    rep: 0.1
    # V1-②: uplift two-hot reward inside βpred (recon MSE otherwise dominates)
    reward: 10.0
  # Reward-head aux uses body_vel * reward_dt as realized displacement (r60
  # actions overshoot early-horizon motion). Match env.step_hz (5 → 0.2).
  reward_dt: 0.2
  decoder:
    train_only: true       # RGB reconstruction supervises training; not stepped online
  lr: 1.0e-4
  train_steps_per_update: 1
  grad_clip: 1000.0        # clip_grad_norm_ (FastWAM convention)
  device: cuda
  checkpoint_dir: experiments/aerial/rl/artifacts/wm_ckpt_v1a_20260815
  # [1b] multi-frame depth head (frozen §3 / §6 Step 3). Train offline via
  # ``python -m experiments.aerial.rl.train_depth_head``. ``enable`` flips to
  # true ONLY after ``_v0_gate`` four-signal PASS (frozen §4) — keep false here.
  depth_head:
    enable: true              # V0 gate PASS 2026-08-14 (v0_gate_r60_20260814.json)
    n_frames: 4
    # Channel width. Canonical AbsRel-PASS ckpt is base=32. Capacity lift
    # (DA-V2 teacher absent offline on H100) uses CLI ``--base 64`` — do NOT
    # silently change this default or init-ckpt from base=32 will refuse.
    base: 32
    lr: 1.0e-4
    grad_clip: 5.0           # real clipping; protects AbsRel from outlier batches
    absrel_weight: 1.0
    nll_weight: 0.1
    # Δ-depth for V0 ③: keep << AbsRel (1.0 from-scratch → AbsRel 0.98/0.70 FAIL).
    # Prefer --init-ckpt finetune from canonical AbsRel-PASS ckpt.
    delta_weight: 0.1
    delta_min_gt_m: 0.5      # approach gate: only ŝ_gt ≥ this contributes
    delta_support_ratio: 0.6 # match §4.1 scale_support_ratio
    approach_oversample: 4   # rank candidate windows by GT |Δ| before batching
    max_depth_m: 200.0       # outdoor AirSim: exclude sky/far-plane from AbsRel
    scale_depth_min_m: 1.0   # ③ navigational band (must match V0GateThresholds)
    scale_depth_max_m: 40.0
    # Near-band terms (train_depth_head also setdefaults). Symmetric near_weight
    # defaults to 3.0 in code. V4-⓪ declare FT (2026-08-21): set near_weight=0 and
    # enable hinge/pinball via CLI — see docs/handover/V4_DEPTH_LOSS_DECLARE_20260821.md
    near_overread_hinge_weight: 0.0
    near_absrel_pinball_weight: 0.0
    near_absrel_pinball_tau: 0.9
    # Declare v2 (default off — enable via CLI on H100):
    fwd_overread_hinge_weight: 0.0
    near_absrel_p90_weight: 0.0
    near_absrel_p90_tau: 0.9
    center_frac: 0.5          # frozen = eval ⓪d / tau default
    trigger_m: 3.0
    # Decoder-only Δ-finetune (CLI --freeze-encoder). Keep false in yaml until a
    # head-only run is intentional; enable via CLI for AbsRel-preserving FT.
    freeze_encoder: false
    checkpoint_dir: experiments/aerial/rl/artifacts/depth_ckpt

imagination:
  batch: 64
  horizon: 10              # <= MAX_IMAGINATION_HORIZON (spec §9 cap)

safety:
  # Three-zone speed governor (declare 20260823): replaces single 3 m depth latch.
  kind: three_zone
  l1_m: 8.0                  # outer speed line (2 m/s cap inside)
  l2_m: 5.0                  # mid speed line (1 m/s cap inside)
  l3_m: 1.5                  # inner stop line (aligns frozen ④ near-collision band)
  v1_m_s: 2.0
  v2_m_s: 1.0
  v_stop_m_s: 0.2
  v_cruise_m_s: 5.0
  a_max_m_s2: 2.5            # conservative vs #28 measured brake p90≈3.23
  delay_s: 0.2               # perception delay budget (offline kinematic only)
  min_tau_s: 1.0             # τ / p_coll emergency latch (unchanged)
  max_p_coll: 0.5
  retreat_step_m: 3.0

# V1b short-horizon imagination planner (test-time scoring, not V4 AC training).
planner:
  enable: false              # stay OFF until planner smoke / design flip
  horizon: 5                 # <= MAX_IMAGINATION_HORIZON (15)

# V1b [1d] time-to-contact head.
# Phase 1 (proxy): kind=gt_proxy + use_gt_depth — GT depth + closing-vel.
# Phase 2 (auth):  kind=foe | foe_calibrated — FOE optical-flow; no GT depth.
tau_predictor:
  enable: true
  kind: foe_calibrated       # V1 PASS deploy flip 2026-08-15 (was gt_proxy)
  use_gt_depth: false        # foe* ignores GT depth
  center_frac: 0.5
  min_closing_m_s: 0.05
  max_tau_s: 60.0
  dt_s: 0.1
  ckpt: experiments/aerial/rl/artifacts/tau_ckpt_foe_r60_20260815/tau_foe_calibrator.pt
  device: cpu

corrector:
  iterations: 10
  episodes_per_iter: 1
  max_steps: 200
  # V0 runs today; V1/V4 stay gated OFF until each milestone passes.
  enable_wm_update: true     # GATE V1a — flipped 2026-08-15 after _wm_train_validate PASS
  enable_policy_update: false # GATE V4: imagination actor-critic update
  strict_gates: false
  # WM-training window sampling (used once enable_wm_update flips on): draw
  # wm_batch windows of wm_window contiguous steps from the replay buffer.
  wm_batch: 32
  wm_window: 8
  smoke: false

# V4 imagination actor-critic (DreamerV3 λ-return; GATE: enable_policy_update stays false).
v4:
  lambda_gae: 0.95
  gamma: 0.997
  entropy_scale: 3.0e-4
  actor_lr: 1.0e-4
  critic_lr: 1.0e-4
  # C2 action-space consistency (2026-08-18, proposal §4.1): the policy
  # distribution is bounded BY CONSTRUCTION — a = limits ⊙ tanh(u) with
  # limits = body_delta_limits(1/env.step_hz), the same box collector.py:167
  # clips to. There is no yaml switch to turn that off: §A.4 showed the
  # unbounded action channel is what produced V4-①'s rank inversion.
  # ``action_scale`` is now a PRE-tanh gain (it used to be a raw output gain,
  # i.e. an unbounded magnitude multiplier). Keep 1.0 — larger only saturates
  # tanh and flattens the gradient.
  action_scale: 1.0
  device: cpu

# Optional OpenFly annotation of episodes (start/goal poses). null -> single
# origin->goal-less episode from the env's default reset.
annotation: null
max_episodes: 20
